services:
  db-test:
    container_name: snippetbox-db-test
    image: mysql:9.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME_TEST}
      MYSQL_USER: ${DB_USER_TEST}
      MYSQL_PASSWORD: ${DB_PASSWORD_TEST}
    ports:
      - "${DB_PORT_TEST}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 0s
    volumes:
      - db_data_test:/var/lib/mysql
    networks:
      - backend_test

volumes:
  db_data_test:

networks:
  backend_test:
