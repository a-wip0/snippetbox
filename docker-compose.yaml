services:
  app:
    container_name: snippetbox-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_PORT: ${APP_PORT}
      DB_HOST: ${DB_DOCKER_HOST}
      DB_PORT: ${DB_PORT_CONTAINER}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./tls:/app/tls:ro
      - ./ui:/app/ui:ro
    networks:
      - backend
    command: go run ./cmd/web
    # command: go run ./cmd/web/ -debug

  db:
    container_name: snippetbox-db
    image: mysql:9.3
    restart: always
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3847:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 2
      start_period: 0s
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
